<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#266e75"/></marker></defs><rect width="1100" height="760" fill="#f4f8fa"/><style>text{font-family:Arial,sans-serif;fill:#13313d}.t{font-size:21px;font-weight:bold}.s{font-size:18px}.l{font-size:17px;fill:#33616c}</style><rect x="20" y="20" width="1060" height="94" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="36" y="50" class="t">Browser UI • vanilla JavaScript</text><text x="36" y="78" class="s">Campaign dashboard + metric assistant  |  Knowledge Q&amp;A + citations + source viewer</text><rect x="20" y="157" width="335" height="120" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="36" y="187" class="t">Campaign metrics path</text><text x="36" y="215" class="s">CSV → filters → metric facts</text><text x="36" y="239" class="s">Server rebuilds snapshot</text><text x="36" y="263" class="s">Brief validates metric references</text><rect x="390" y="157" width="360" height="120" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="406" y="187" class="t">Node API • loopback only</text><text x="406" y="215" class="s">Session + CSRF + consent gates</text><text x="406" y="239" class="s">Knowledge routes / RAG service</text><text x="406" y="263" class="s">Timeouts, cancellation, limits</text><rect x="785" y="157" width="295" height="120" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="801" y="187" class="t">Private local configuration</text><text x="801" y="215" class="s">Server-side API keys</text><text x="801" y="239" class="s">Saved nonsecret settings</text><text x="801" y="263" class="s">Session-only billing consent</text><path d="M185 114 V157" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M570 114 V157" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M785 215 H750" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="330" width="335" height="145" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="36" y="360" class="t">Local document corpus</text><text x="36" y="388" class="s">28 synthetic sources</text><text x="36" y="412" class="s">Clean → section chunks</text><text x="36" y="436" class="s">180 words / 30 overlap</text><text x="36" y="460" class="s">Hashes + status + version</text><rect x="390" y="330" width="360" height="145" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="406" y="360" class="t">Retrieve and assemble</text><text x="406" y="388" class="s">Validate remote IDs locally</text><text x="406" y="412" class="s">Vector 5 + keyword up to 5</text><text x="406" y="436" class="s">Linked history up to 2</text><text x="406" y="460" class="s">18,000-character context cap</text><rect x="785" y="330" width="295" height="145" rx="12" fill="#e3f2ee" stroke="#8ca8b0"/><text x="801" y="360" class="t">Pinecone • external API</text><text x="801" y="388" class="s">Integrated embeddings</text><text x="801" y="412" class="s">llama-text-embed-v2</text><text x="801" y="436" class="s">1024 dims • cosine</text><text x="801" y="460" class="s">Isolated corpus namespace</text><path d="M570 277 V330" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M355 402 H390" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M750 385 H785" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M785 425 H750" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M185 330 V303 H925 V330" stroke="#266e75" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="206" y="297" class="l">Explicit ingestion upload → text embedded and stored remotely</text><rect x="390" y="530" width="360" height="130" rx="12" fill="#e3f2ee" stroke="#8ca8b0"/><text x="406" y="560" class="t">Grounded generation</text><text x="406" y="588" class="s">Question + selected evidence</text><text x="406" y="612" class="s">Claude API → structured JSON</text><text x="406" y="636" class="s">Answer / clarify / abstain</text><rect x="20" y="530" width="335" height="130" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="36" y="560" class="t">Validate and display</text><text x="36" y="588" class="s">Schema + corpus version</text><text x="36" y="612" class="s">Retrieved IDs + exact quotes</text><text x="36" y="636" class="s">Source viewer for human review</text><rect x="785" y="530" width="295" height="145" rx="12" fill="#ffffff" stroke="#8ca8b0"/><text x="801" y="560" class="t">Implemented alternatives</text><text x="801" y="588" class="s">OpenAI generation adapter</text><text x="801" y="612" class="s">OpenAI embeddings + local</text><text x="801" y="636" class="s">vectors / external Pinecone</text><text x="801" y="660" class="s">Not the tested live setup</text><path d="M570 475 V530" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M390 594 H355" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><path d="M20 594 H8 V70 H20" fill="none" stroke="#266e75" stroke-width="2.5" marker-end="url(#a)"/><text x="24" y="705" class="s">Solid arrows: question and answer path. Dashed arrow: explicit ingestion upload.</text><text x="24" y="734" class="s">CSV metrics are not embedded in this document RAG pipeline. No LangChain or LangGraph orchestration.</text></svg>