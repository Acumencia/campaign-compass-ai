<!doctype html><html lang="en"><meta charset="utf-8"><title>Campaign Compass — saved live evidence replay</title><style>*{box-sizing:border-box}body{margin:0;background:#0c171a;color:#eef5ed;font-family:Arial,sans-serif}main{padding:32px 52px 24px;height:768px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;color:#b8d2cb;font-size:17px;letter-spacing:.04em}.badge{color:#d2ff8c;border:1px solid #567c51;padding:7px 12px;border-radius:6px}h1{font-size:38px;line-height:1.15;margin:27px 0 24px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0}article{background:#16272b;border:1px solid #385055;border-radius:14px;padding:26px;overflow:hidden}h2{font-size:23px;color:#cbf7a0;margin:0 0 20px}p{font-size:23px;line-height:1.42;white-space:pre-line;margin:0 0 17px}blockquote{font-size:22px;line-height:1.4;margin:18px 0;padding:12px 0 12px 18px;border-left:3px solid #c9f58f;color:#f2f6ee}.source{font-size:16px;line-height:1.35;color:#b1c7c2}.pill{font-size:19px;display:inline-block;padding:8px 13px;border-radius:6px;background:#3e3931;color:#ffe0a3}.good{background:#25452f;color:#d4ffad}.caption{font-size:21px;line-height:1.35;margin:22px 0 10px;color:#dceacb}.provenance{font-size:14px;line-height:1.3;color:#a5bdb7}.foot{display:flex;justify-content:space-between;margin-top:12px;font-size:15px;color:#b8d2cb}button{background:#25452f;color:white;border:1px solid #719b61;border-radius:5px;font-size:16px;padding:5px 12px;margin-left:8px}#controls{position:fixed;bottom:7px;right:48px}.recording #controls{display:none}</style><main><div class="top"><span>CAMPAIGN COMPASS / WEEK 2</span><span class="badge">SAVED LIVE RESULTS • REPLAY • NO NEW REQUESTS</span></div><h1 id="title"></h1><section class="grid" id="cards"></section><p class="caption" id="caption"></p><div class="provenance" id="source"></div><div class="foot"><span>Original synthetic teaching corpus · source-supported Q&A</span><span id="counter"></span></div></main><div id="controls"><button id="previous">Previous</button><button id="next">Next</button></div><script>const scenes=[{"title": "Campaign Compass: answers you can inspect", "body": "<article><h2>Who this helps<\/h2><p>A marketer checking fictional product, policy and campaign facts before drafting copy.<\/p><\/article><article><h2>What this video shows<\/h2><p>A replay of genuine saved live outputs, their source passages, and the failures we kept. No provider requests occur during this recording.<\/p><\/article>", "caption": "Week 1 dashboard reused; Week 2 adds retrieval and cited Q&A. Captioned walkthrough; no narration.", "seconds": 12, "source": "Local project and retained evidence"}, {"title": "From source documents to a cited answer", "body": "<article><h2>Prepare the evidence<\/h2><p>28 original synthetic documents \u2192 normalize whitespace \u2192 heading-aware chunks: up to 180 words, with 30-word overlap. 119 chunks retain source lines, versions and hashes.<\/p><\/article><article><h2>Ask a question<\/h2><p>Pinecone integrated embeddings \u2192 existing vector index \u2192 semantic + local keyword passages \u2192 bounded context \u2192 Claude \u2192 citation checks \u2192 source inspection.<\/p><\/article>", "caption": "Refresh is explicit: changed documents require re-ingestion and matching vectors. No real customer data.", "seconds": 19, "source": "Local project and retained evidence"}, {"title": "Same question, different evidence", "body": "<article><h2>Without retrieval \u2014 saved live summary<\/h2><p>No reliable product specifications supplied; declined to confirm waterproofing.<\/p><span class=\"pill\">Insufficient evidence<\/span><\/article><article><h2>With retrieval \u2014 saved live answer summary<\/h2><p>No. The Dayline pack may not be described as waterproof; its shell resists light splashes but is not waterproof.<\/p><span class=\"pill good\">Cited answer<\/span><\/article>", "caption": "Question: Can the Dayline pack be called waterproof?", "seconds": 20, "source": "2026-10-19 13:51 UTC \u2022 contemporaneous UI transcription; comparison summaries, not raw response text"}, {"title": "Inspect the support, not just the answer", "body": "<article><h2>Product specification<\/h2><blockquote>The shell resists light splashes but is not waterproof.<\/blockquote><p>pack \u00b7 Care and price \u00b7 lines 6\u20136<\/p><p>Saved retrieval score: 0.5811<\/p><\/article><article><h2>Claims policy<\/h2><blockquote>The Dayline pack may be described as resisting light splashes, with the limitation that it is not waterproof.<\/blockquote><p>claims \u00b7 Approved and prohibited claims<\/p><p>Saved retrieval score: 0.5260<\/p><\/article>", "caption": "Scores measure similarity, not truth. Quote matching establishes text presence; meaning still needs review.", "seconds": 19, "source": "Source excerpts supporting the retained waterproof comparison"}, {"title": "Recover a missing product detail", "body": "<article><h2>Saved live question and answer<\/h2><p>Does Ridgeline have a padded electronics compartment?<\/p><p>No. The Ridgeline tote has no padded electronics compartment (and no closure); it has a cotton canvas body and fixed cotton handles.<\/p><\/article><article><h2>Supplied source passage<\/h2><blockquote>The tote has a cotton canvas body and fixed cotton handles. It has no closure or padded electronics compartment.<\/blockquote><div class=\"source\">tote \u00b7 Materials \u00b7 lines 8\u20138 \u00b7 active<\/div><\/article>", "caption": "The original semantic search missed Materials. Bounded local keyword coverage now supplies it.", "seconds": 18, "source": "K17 \u2022 saved live follow-up, 2026-10-19 15:11\u201315:12 UTC"}, {"title": "Explain current and historical versions", "body": "<article><h2>Current: 18 liters<\/h2><p>The current Dayline pack capacity is 18 liters, per the active pack specification.<\/p><blockquote>The fictional Dayline pack has an 18-liter capacity and weighs 540 grams.<\/blockquote><div class=\"source\">pack \u00b7 Capacity and fit \u00b7 lines 4\u20134 \u00b7 active<\/div><\/article><article><h2>Historical: 16 liters<\/h2><blockquote>ARCHIVED: Dayline v1 listed 16 liters during the fictional 2025 pilot. This document was superseded by the active Dayline specification. Do not use 16 liters for the current 18-liter product.<\/blockquote><div class=\"source\">dayline-v1 \u00b7 Historical capacity \u00b7 lines 5\u20135 \u00b7 superseded<\/div><\/article>", "caption": "Linked archives explain an old value; they cannot establish a current claim. Explicit source filters remain authoritative.", "seconds": 22, "source": "K28 \u2022 saved live follow-up; active and superseded sources remain distinct"}, {"title": "Ask when the question is underspecified", "body": "<article><h2>Question<\/h2><p>Which bag fits my device?<\/p><p>A bag\u2019s nominal capacity or a device\u2019s screen size does not establish physical fit.<\/p><\/article><article><h2>Actual saved clarification<\/h2><p>What device do you want to carry, and what are its physical length, width and thickness (with units)? Also, how do you plan to carry it, and does it need padding or protection?<\/p><\/article>", "caption": "This clarification came from the live model. It needed no local completion and makes no claim that a device fits.", "seconds": 17, "source": "K24 \u2022 saved live follow-up"}, {"title": "Show calculation inputs and policy", "body": "<article><h2>Actual saved answer<\/h2><p>Does an eligible 80 demo USD subtotal qualify for free shipping after EVERYDAY10?<\/p><p>Calculation: an eligible 80 demo USD subtotal minus 10 percent (8 demo USD) equals 72 demo USD. Because 72 is below the 75 demo USD threshold, standard shipping is not free, so the standard 6 demo USD shipping charge applies.<\/p><\/article><article><h2>Supporting calculation example<\/h2><blockquote>An eligible merchandise subtotal of 80 demo USD becomes 72 after a 10 percent discount. Because 72 is below the active 75 threshold, standard shipping is not free.<\/blockquote><div class=\"source\">offer-examples \u00b7 Threshold arithmetic \u00b7 lines 8\u20138 \u00b7 active<\/div><\/article>", "caption": "The question assumes an eligible subtotal. Arithmetic and the shipping rule are both grounded in supplied evidence.", "seconds": 21, "source": "K22 \u2022 saved live follow-up; earlier baseline validation failure remains recorded"}, {"title": "Keep the failures visible", "body": "<article><h2>Five complete outcomes<\/h2><p>K17: tote materials\nK24: device clarification\nK28: current versus archived capacity\nK29: current versus expired shipping rule\nK22: discount and shipping calculation<\/p><\/article><article><h2>Two answers rejected<\/h2><p>K08 and K30 failed citation validation.\nK08 had all expected evidence.\nK30 still lacked the supersession section.\nExact offending fields were not retained; root cause remains uncertain.<\/p><\/article>", "caption": "Not an all-pass result. We did not retry, weaken citation checks, or identify formatting as the established cause.", "seconds": 23, "source": "Seven approved development cases \u2022 7 searches + 7 generations; no reupload"}, {"title": "What the results establish\u2014and what they do not", "body": "<article><h2>Practical checks<\/h2><p>14 accepted claims in the follow-up had supporting quotes. Five of seven development outcomes were complete. The full original 30-question run remains preserved, including every failure.<\/p><\/article><article><h2>Limits<\/h2><p>These cases guided the fixes; they do not prove unseen accuracy. Pipeline median: 6.93 s; maximum: 11.79 s. Browser overhead excluded. A sub-10-second experience is not established.<\/p><\/article>", "caption": "No new provider calls in this video. The saved comparison and follow-up used Claude + Pinecone; offline tests used mocks.", "seconds": 20, "source": "Local project and retained evidence"}, {"title": "A bounded, inspectable RAG demonstration", "body": "<article><h2>Delivered<\/h2><p>Reused interface, auditable synthetic corpus, vector retrieval plus keyword coverage, cited answers, source inspection, clarification and explicit failures.<\/p><\/article><article><h2>Next work<\/h2><p>Diagnose K08/K30 citation rejections without guessing their root cause. Broaden practical question checks. Keep human review before using generated campaign claims.<\/p><\/article>", "caption": "Local submission artifacts only. Public uploads, GitHub push and form submission remain paused.", "seconds": 13, "source": "Local project and retained evidence"}];let current=0;function showScene(n){current=Math.max(0,Math.min(scenes.length-1,n));const s=scenes[current];document.getElementById("title").textContent=s.title;document.getElementById("cards").innerHTML=s.body;document.getElementById("caption").textContent=s.caption;document.getElementById("source").textContent=s.source;document.getElementById("counter").textContent=(current+1)+" / "+scenes.length;}document.getElementById("previous").onclick=()=>showScene(current-1);document.getElementById("next").onclick=()=>showScene(current+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")showScene(current+1);if(e.key==="ArrowLeft")showScene(current-1)});showScene(0);</script></html>
